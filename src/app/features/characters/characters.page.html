<ion-content [fullscreen]="true">

  @for(character of characters ;track character.id){
    <app-card 
      [title]="character.name"
      [image]="character.image"
      [subtitle]="character.status"
      [description]="character.species"
    >
    </app-card>
    }

 
 
</ion-content>
