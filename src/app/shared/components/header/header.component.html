<ion-header class="ion-no-border">

  <ion-toolbar
    class="!h-14 !min-h-14
           [--background:#0B1020]
           [--color:#FFFFFF]"
  >

    <!-- MENÚ -->
    <ion-buttons slot="start" class="!ml-2">
      <ion-button
        fill="clear"
        (click)="openMenu()"
        class="!m-0 !h-10 !w-10 [--color:#97CE4C]"
      >
        <ion-icon
          slot="icon-only"
          name="menu-outline"
          class="!text-2xl !text-[#97CE4C]"
        ></ion-icon>
      </ion-button>
    </ion-buttons>

    <!-- TÍTULO -->
    <div class="ml-1 flex h-full items-center gap-2">

      <span
        class="h-3 w-3 shrink-0 rounded-full
               bg-[#97CE4C]
               shadow-[0_0_10px_#97CE4C]"
      ></span>

      <span
        class="whitespace-nowrap text-base font-bold text-white"
      >
        {{ title }}
      </span>

    </div>

  </ion-toolbar>

  <div
    class="h-[2px]
           bg-[#97CE4C]
           shadow-[0_0_8px_#97CE4C]"
  ></div>

</ion-header>
