<ion-card>
  @if(image){
    <img [src]="image" alt="Card Image" />
  }
   <ion-card-header>
    <ion-card-title>{{ title | uppercase}}</ion-card-title>
    <ion-card-subtitle [color]="getStatusColor(subtitle)">
      {{ subtitle }}
      </ion-card-subtitle>
  </ion-card-header>
  <ion-card-content>
    <p>{{ description }}</p>
  </ion-card-content>
</ion-card>
